name: Release Please
run-name: Release created by @${{ github.actor }}

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release-status: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
          
      - name: Release Please
        uses: google-github-actions/release-please-action@v3
        id: release
        with:
          release-type: node
          default-branch: master
          package-name: ${{ env.IMAGE_NAME }}
          pull-request-title-pattern: 'Release ${version} @ ${{ env.IMAGE_NAME }}'

  publish-package:
    name: Publish Package to NPM
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release-status == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure latest npm
        run: npm install -g npm@latest

      - name: Publish to NPM
        run: |
          npm ci
          npm run lint
          npm publish --access public
