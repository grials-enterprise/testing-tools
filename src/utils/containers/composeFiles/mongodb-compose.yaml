version: '3.8'
services:
  mongo:
    image: mongo:7.0
    container_name: mongo-container
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    networks:
      - mongo-network
    # volumes:
    #   - mongo-data:/data/db
networks:
  mongo-network:
    driver: bridge
# volumes:
#   mongo-data:
