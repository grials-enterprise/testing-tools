# Compose para entorno de pruebas de Redis
# - Sin persistencia por defecto (más rápido, limpio cada arranque)
# - Volumen opcional activable vía USE_REDIS_PERSISTENCE=1
# - Variables externalizadas (.env)
# - Perfil "test" (docker compose --profile test up -d)

version: '3.8'
services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-testing
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}
      # Ajusta si activas persistencia (appendonly yes ralentiza tests largos)
      REDIS_APPENDONLY: ${REDIS_APPENDONLY:-no}
    command:
      - sh
      - -c
      - |
        set -e
        # Construye flags dinámicos según variables
        FLAGS="--save '' --appendonly $${REDIS_APPENDONLY}"
        if [ "$${REDIS_PASSWORD}" != "" ]; then
          FLAGS="$${FLAGS} --requirepass $${REDIS_PASSWORD}"
        fi
        echo "Launching redis-server $${FLAGS}"
        exec redis-server $${FLAGS}
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"
    volumes:
      - type: volume
        source: redis-data
        target: /data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-admin} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"
    labels:
      purpose: testing
      service: redis

volumes:
  redis-data: