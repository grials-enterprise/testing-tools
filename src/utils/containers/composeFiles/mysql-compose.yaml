version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: testdb
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - mysql-network
    # volumes:
    #   - mysql-data:/var/lib/mysql

networks:
  mysql-network:
    driver: bridge

