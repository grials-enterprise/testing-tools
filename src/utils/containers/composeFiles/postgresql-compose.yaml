version: '3.8'
services:
  postgres:
    image: postgres:16.3
    container_name: postgres-container
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test
    networks:
      - postgres-network
    # volumes:
    #   - postgres-data:/var/lib/postgresql/data
networks:
  postgres-network:
    driver: bridge
# volumes:
#   postgres-data: